name: CI & Wazig Benchmarks

on:
  push:
    branches: [main, wazig]
  pull_request:
    branches: [main, wazig]
  workflow_dispatch:

permissions:
  contents: read

env:
  GHR_VERSION: v0.10.2
  WASMTIME_VERSION: v50.0.1
  WAZIG_VERSION: v0.17.0-wazig.6
  WAZIGL_VERSION: v0.17.0-wazigl.6
  ZIG_VERSION: v0.17.0

jobs:
  zigar-runtime:
    name: zigar-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and run tests
        run: cd zigar-runtime && npm ci && npm run test:both

  zigar-compiler-wazig:
    name: zigar-compiler (USE_WAZIG=1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ghr, wasmtime, wazig, and zig
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/cataggar/ghr/releases/download/${GHR_VERSION}/ghr-${GHR_VERSION#v}-linux-x64.tar.gz" \
            | tar -xzf - --strip-components=2 -C "$HOME/.local/bin" "ghr-${GHR_VERSION#v}-linux-x64/bin/ghr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ghr version
          ghr install --skip-attestation "bytecodealliance/wasmtime@${WASMTIME_VERSION}"
          ghr install --skip-attestation "cataggar/zig@${WAZIG_VERSION}"
          ghr install --skip-attestation "cataggar/zig@${ZIG_VERSION}"
          wasmtime --version
          wazig version
          zig version

      - name: Install npm dependencies and link workspace packages
        run: |
          set -euo pipefail
          (cd zigar-runtime && npm ci)
          (cd zigar-compiler && npm ci)
          (
            cd rollup-plugin-zigar
            npm ci
            rm -rf node_modules/zigar-compiler node_modules/zigar-runtime
            ln -s ../../zigar-compiler node_modules/zigar-compiler
            ln -s ../../zigar-runtime node_modules/zigar-runtime
          )

      - name: Run wit-zigar unit and bindgen tests
        run: |
          cd wit-zigar
          zig build test

      - name: Run zigar.js wasm32-wasi unit tests
        run: zig test -target wasm32-wasi zigar-compiler/zig/type/js.zig --test-cmd wasmtime --test-cmd-bin

      - name: Run zigar-compiler tests (USE_WAZIG=1)
        env:
          USE_WAZIG: '1'
          DEV: '1'
          TARGET: 'wasm'
          BITS: '32'
          MIXIN: 'track'
        run: |
          cd zigar-compiler
          npx mocha --timeout 600000 \
            test/configuration.test.js \
            test/code-generation.test.js \
            test/utility-functions.test.js \
            test/wasm-decoding.test.js \
            test/transpilation.test.js \
            test/compilation.test.js \
            test/wit-zigar-bridge.test.js \
            test/js-value-handles.test.js \
            test/es-module-imports.test.js \
            test/js-standard-wrappers.test.js \
            --grep "compile code for Windows$|should fail when directory is illegal$" \
            --invert

      - name: Run rollup-plugin-zigar tests (USE_WAZIG=1)
        env:
          USE_WAZIG: '1'
        run: |
          cd rollup-plugin-zigar
          npx mocha --no-warnings --timeout 600000 test/index.test.js

  zigar-compiler-zig:
    name: zigar-compiler (USE_WAZIG=0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ghr, zig, wasmtime, and wazig
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/cataggar/ghr/releases/download/${GHR_VERSION}/ghr-${GHR_VERSION#v}-linux-x64.tar.gz" \
            | tar -xzf - --strip-components=2 -C "$HOME/.local/bin" "ghr-${GHR_VERSION#v}-linux-x64/bin/ghr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ghr version
          ghr install --skip-attestation "bytecodealliance/wasmtime@${WASMTIME_VERSION}"
          ghr install --skip-attestation "cataggar/zig@${WAZIG_VERSION}"
          ghr install --skip-attestation "cataggar/zig@${ZIG_VERSION}"
          wasmtime --version
          wazig version
          zig version

      - name: Install npm dependencies and link workspace packages
        run: |
          set -euo pipefail
          (cd zigar-runtime && npm ci)
          (cd zigar-compiler && npm ci)
          (
            cd rollup-plugin-zigar
            npm ci
            rm -rf node_modules/zigar-compiler node_modules/zigar-runtime
            ln -s ../../zigar-compiler node_modules/zigar-compiler
            ln -s ../../zigar-runtime node_modules/zigar-runtime
          )

      - name: Apply wasi-thread.patch required by standard zig for multithreaded WASM
        run: |
          set -euo pipefail
          ZIG_REAL_BIN="$(realpath "$(which zig)")"
          ZIG_LIB_DIR="$(dirname "$ZIG_REAL_BIN")/lib"
          patch -p0 -N -d "$ZIG_LIB_DIR" < zigar-compiler/wasi-thread.patch

      - name: Run zigar-compiler tests (USE_WAZIG=0)
        env:
          USE_WAZIG: '0'
          DEV: '1'
          TARGET: 'wasm'
          BITS: '32'
          MIXIN: 'track'
        run: |
          cd zigar-compiler
          npx mocha --timeout 600000 \
            test/configuration.test.js \
            test/code-generation.test.js \
            test/utility-functions.test.js \
            test/wasm-decoding.test.js \
            test/transpilation.test.js \
            test/compilation.test.js \
            test/js-value-handles.test.js \
            test/es-module-imports.test.js \
            test/js-standard-wrappers.test.js \
            --grep "compile code for Windows$|should fail when directory is illegal$" \
            --invert

      - name: Run rollup-plugin-zigar tests (USE_WAZIG=0)
        env:
          USE_WAZIG: '0'
        run: |
          cd rollup-plugin-zigar
          npx mocha --no-warnings --timeout 600000 test/index.test.js

  native-addons:
    name: node-zigar & bun-zigar (Native JsValue)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install ghr and zig
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/cataggar/ghr/releases/download/${GHR_VERSION}/ghr-${GHR_VERSION#v}-linux-x64.tar.gz" \
            | tar -xzf - --strip-components=2 -C "$HOME/.local/bin" "ghr-${GHR_VERSION#v}-linux-x64/bin/ghr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ghr install --skip-attestation "cataggar/zig@${ZIG_VERSION}"
          zig version

      - name: Run zigar.js.Ref(T) Zig unit tests
        run: zig test zigar-compiler/zig/type/js.zig

      - name: Install dependencies and link workspace packages
        run: |
          set -euo pipefail
          (cd zigar-runtime && npm ci)
          (cd zigar-compiler && npm ci)
          (cd node-zigar-addon && npm ci)
          (
            cd node-zigar
            npm ci
            rm -rf node_modules/zigar-compiler node_modules/node-zigar-addon
            ln -s ../../zigar-compiler node_modules/zigar-compiler
            ln -s ../../node-zigar-addon node_modules/node-zigar-addon
          )
          (
            cd bun-zigar
            bun install --frozen-lockfile || bun install
            rm -rf node_modules/zigar-compiler node_modules/node-zigar-addon
            ln -s ../../zigar-compiler node_modules/zigar-compiler
            ln -s ../../node-zigar-addon node_modules/node-zigar-addon
          )

      - name: Run node-zigar loader, worker, and native JsValue handle tests
        env:
          USE_WAZIG: '0'
        run: |
          cd node-zigar
          npx mocha --loader=./dist/index.js --no-warnings --timeout 300000 \
            test/index-cjs.test.js \
            test/index.test.js \
            test/worker.test.js \
            test/js-value-handles.test.js \
            test/es-module-imports.test.js \
            test/js-standard-wrappers.test.js

      - name: Run bun-zigar native JsValue handle tests
        env:
          USE_WAZIG: '0'
        run: |
          cd bun-zigar
          bun node_modules/mocha/bin/mocha.js --timeout 300000 -- test/js-value-handles.test.js test/es-module-imports.test.js test/js-standard-wrappers.test.js

  ts-zigar:
    name: ts-zigar (TypeScript 7.1 + Node 26 + WASM & Native E2E)
    runs-on: ubuntu-latest
    env:
      COMPONENTIZE_GO_VERSION: v0.5.3
      TS_ZIGAR_REQUIRE_TS71: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Cache TypeScript 7.1 upstream checkout & staged npm package
        uses: actions/cache@v4
        with:
          path: |
            .cache/ts-zigar
            ts-zigar/component/dist
          key: ts-zigar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ts-zigar/component/build-component.mjs', 'ts-zigar/component/build-typescript-pkg.mjs', 'ts-zigar/wit/typescript.wit', 'ts-zigar/component/adapter/**/*.go') }}
          restore-keys: |
            ts-zigar-${{ runner.os }}-${{ runner.arch }}-

      - name: Install ghr, componentize-go, wasmtime, wazig, and zig
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/cataggar/ghr/releases/download/${GHR_VERSION}/ghr-${GHR_VERSION#v}-linux-x64.tar.gz" \
            | tar -xzf - --strip-components=2 -C "$HOME/.local/bin" "ghr-${GHR_VERSION#v}-linux-x64/bin/ghr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ghr install --skip-attestation "bytecodealliance/componentize-go@${COMPONENTIZE_GO_VERSION}"
          ghr install --skip-attestation "bytecodealliance/wasmtime@${WASMTIME_VERSION}"
          ghr install --skip-attestation "cataggar/zig@${WAZIG_VERSION}"
          ghr install --skip-attestation "cataggar/zig@${ZIG_VERSION}"
          componentize-go --version
          wazig version
          zig version

      - name: Install workspace npm dependencies
        run: |
          set -euo pipefail
          (cd zigar-runtime && npm ci)
          (cd zigar-compiler && npm ci)
          (cd node-zigar-addon && npm ci)
          (
            cd node-zigar
            npm ci
            rm -rf node_modules/zigar-compiler node_modules/node-zigar-addon
            ln -s ../../zigar-compiler node_modules/zigar-compiler
            ln -s ../../node-zigar-addon node_modules/node-zigar-addon
          )
          if [ ! -f .cache/ts-zigar/types-node26/node_modules/@types/node/package.json ]; then
            mkdir -p .cache/ts-zigar/types-node26
            (cd .cache/ts-zigar/types-node26 && npm init -y >/dev/null && npm install --no-audit --no-fund @types/node@26)
          fi

      - name: Run ts-zigar component, @types/node, and TypeScript 7.1 torture tests
        run: |
          set -euo pipefail
          cd ts-zigar
          zig build test-component
          zig build test -Drequire-ts71=true --summary all

      - name: Run ts-zigar WASM32 & WASM64 roundtrip tests (zigar-compiler)
        env:
          USE_WAZIG: '1'
          DEV: '1'
          TARGET: 'wasm'
          BITS: '32'
          MIXIN: 'track'
        run: |
          set -euo pipefail
          cd zigar-compiler
          npx mocha --timeout 600000 \
            test/component-host.test.js \
            test/ts-zigar-cli.test.js \
            test/ts-zigar-m2-types.test.js \
            test/ts-zigar-m2-values.test.js \
            test/ts-zigar-m3-classes.test.js \
            test/ts-zigar-m3-generics.test.js \
            test/ts-zigar-m3-protocols.test.js \
            test/ts-zigar-m3-ts71.test.js \
            test/ts-zigar-m4-node26-core.test.js \
            test/ts-zigar-m4-node26-events-streams.test.js

      - name: Run ts-zigar Native ESM & CJS roundtrip tests (node-zigar)
        env:
          USE_WAZIG: '0'
        run: |
          set -euo pipefail
          cd node-zigar
          npx mocha --no-warnings --timeout 600000 \
            test/ts-zigar-m2-values.test.js \
            test/ts-zigar-m3-classes.test.js \
            test/ts-zigar-m3-generics.test.js \
            test/ts-zigar-m3-protocols.test.js \
            test/ts-zigar-m3-ts71.test.js \
            test/ts-zigar-m4-node26-core.test.js \
            test/ts-zigar-m4-node26-events-streams.test.js

  benchmarks:
    name: Wazig vs Zig Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and time toolchains (wazig vs zig)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/cataggar/ghr/releases/download/${GHR_VERSION}/ghr-${GHR_VERSION#v}-linux-x64.tar.gz" \
            | tar -xzf - --strip-components=2 -C "$HOME/.local/bin" "ghr-${GHR_VERSION#v}-linux-x64/bin/ghr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ghr version

          WASM_START_MS=$(date +%s%3N)
          ghr install --skip-attestation "bytecodealliance/wasmtime@${WASMTIME_VERSION}"
          WASM_END_MS=$(date +%s%3N)
          WASMTIME_INSTALL_MS=$((WASM_END_MS - WASM_START_MS))

          WAZIG_START_MS=$(date +%s%3N)
          ghr install --skip-attestation "cataggar/zig@${WAZIG_VERSION}"
          WAZIG_END_MS=$(date +%s%3N)
          WAZIG_INSTALL_MS=$((WAZIG_END_MS - WAZIG_START_MS))

          WAZIGL_START_MS=$(date +%s%3N)
          ghr install --skip-attestation "cataggar/zig@${WAZIGL_VERSION}"
          WAZIGL_END_MS=$(date +%s%3N)
          WAZIGL_INSTALL_MS=$((WAZIGL_END_MS - WAZIGL_START_MS))

          ZIG_START_MS=$(date +%s%3N)
          ghr install --skip-attestation "cataggar/zig@${ZIG_VERSION}"
          ZIG_END_MS=$(date +%s%3N)
          ZIG_INSTALL_MS=$((ZIG_END_MS - ZIG_START_MS))

          wasmtime --version
          wazig version
          wazigl version
          zig version

          WAZIG_UNIT_SIZE=$(du -sh "$HOME/.local/share/ghr/tools/_v2/units/u-cataggar/u-zig/u-wazig/_unit" | cut -f1)
          WAZIGL_UNIT_SIZE=$(du -sh "$HOME/.local/share/ghr/tools/_v2/units/u-cataggar/u-zig/u-wazigl/_unit" | cut -f1)
          ZIG_UNIT_SIZE=$(du -sh "$HOME/.local/share/ghr/tools/_v2/units/u-cataggar/u-zig/_unit" | cut -f1)

          {
            echo "## CI Toolchain Download & Install Comparison"
            echo ""
            echo "| Toolchain | Release | Install Time (ms) | Installed Size |"
            echo "| --- | --- | ---: | ---: |"
            echo "| \`wazig\` | \`cataggar/zig@${WAZIG_VERSION}\` | ${WAZIG_INSTALL_MS} ms | ${WAZIG_UNIT_SIZE} |"
            echo "| \`wazigl\` (Wasm + LLVM) | \`cataggar/zig@${WAZIGL_VERSION}\` | ${WAZIGL_INSTALL_MS} ms | ${WAZIGL_UNIT_SIZE} |"
            echo "| \`wasmtime\` (runtime) | \`bytecodealliance/wasmtime@${WASMTIME_VERSION}\` | ${WASMTIME_INSTALL_MS} ms | - |"
            echo "| \`zig\` (native x86_64-linux) | \`cataggar/zig@${ZIG_VERSION}\` | ${ZIG_INSTALL_MS} ms | ${ZIG_UNIT_SIZE} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install npm dependencies and link workspace packages
        run: |
          set -euo pipefail
          (cd zigar-runtime && npm ci)
          (cd zigar-compiler && npm ci)
          (
            cd rollup-plugin-zigar
            npm ci
            rm -rf node_modules/zigar-compiler node_modules/zigar-runtime
            ln -s ../../zigar-compiler node_modules/zigar-compiler
            ln -s ../../zigar-runtime node_modules/zigar-runtime
          )

      - name: Run Wazig vs Zig benchmarks
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node benchmarks/wit-zigar-benchmark.js
          node benchmarks/wazig-benchmark.js --quick --markdown "${RUNNER_TEMP}/bench-results.md" --json "${RUNNER_TEMP}/bench-results.json"
          cat "${RUNNER_TEMP}/bench-results.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wazig-benchmark-results
          path: |
            ${{ runner.temp }}/bench-results.md
            ${{ runner.temp }}/bench-results.json
